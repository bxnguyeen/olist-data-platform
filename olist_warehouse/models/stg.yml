version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
  
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
      
      - name: customer_unique_id
        data_tests:
          - not_null

  - name: stg_order_items
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      
      - name: order_item_id
        data_tests:
          - not_null
      
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      
      - name: seller_id
        data_tests:
          - not_null
      
      - name: price
        data_tests:
          - not_null
      
      - name: freight_value
        data_tests:
          - not_null
      
  - name: stg_products
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique
      
      - name: product_category_name
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_product_category_name_translation')
                field: product_category_name
              config:
                severity: warn

  - name: stg_product_category_name_translation
    columns:
      - name: product_category_name
        data_tests:
          - not_null
      
      - name: product_category_name_english
        data_tests:
          - not_null